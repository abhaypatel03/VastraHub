{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | VastraHub</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <div class="settings-page">

        <div class="settings-header">
            <a href="{% url 'profile' %}" class="back-btn">←</a>
            <h1>Settings</h1>
        </div>

        <div class="settings-list">

            <a href="{% url 'order_updates' %}" class="setting-item">
                <div>
                    <h3>Order Updates</h3>
                    <p>Manage your order notifications</p>
                </div>
                <span>›</span>
            </a>

            <a href="{% url 'theme' %}" class="setting-item">
                <div>
                    <h3>Theme</h3>
                    <p>Choose your preferred theme</p>
                </div>
                <span>›</span>
            </a>

            <a href="{% url 'security' %}" class="setting-item">
                <div>
                    <h3>Security</h3>
                    <p>Manage your account security</p>
                </div>
                <span>›</span>
            </a>

            <a href="{% url 'help_support' %}" class="setting-item">
                <div>
                    <h3>Help & Support</h3>
                    <p>Get help with VastraHub</p>
                </div>
                <span>›</span>
            </a>

            <a href="{% url 'delete_account' %}" class="setting-item danger">
                <div>
                    <h3>Delete Account</h3>
                    <p>Remove your VastraHub account</p>
                </div>
                <span>›</span>
            </a>

        </div>

    </div>

</body>
</html>
