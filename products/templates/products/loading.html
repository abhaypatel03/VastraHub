{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VastraHub | Loading</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #f8f3fb,
                #eee2f3
            );

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* ==============================
           LOADING BOX
        ============================== */

        .loading-container {
            width: 90%;

            max-width: 400px;

            text-align: center;
        }


        /* ==============================
           LOGO
        ============================== */

        .logo-box {

            width: 82px;
            height: 82px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 24px;

            background: linear-gradient(
                135deg,
                #49225b,
                #8e54a8
            );

            color: white;

            font-size: 36px;

            font-weight: 900;

            box-shadow:
                0 18px 40px
                rgba(73, 34, 91, 0.25);

            animation: logoAnimation 1.5s
                       ease-in-out infinite;
        }


        /* ==============================
           BRAND NAME
        ============================== */

        .brand-name {

            font-size: 30px;

            font-weight: 900;

            color: #49225b;

            letter-spacing: .3px;
        }


        .brand-subtitle {

            margin-top: 7px;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 4px;

            color: #9b7aa7;
        }


        /* ==============================
           SPINNER
        ============================== */

        .spinner {

            width: 48px;
            height: 48px;

            margin: 32px auto 20px;

            border-radius: 50%;

            border: 4px solid #e3d6e8;

            border-top-color: #6e3482;

            animation:
                spin .8s linear infinite;
        }


        /* ==============================
           LOADING TEXT
        ============================== */

        .loading-text {

            color: #6f5878;

            font-size: 14px;

            font-weight: 500;
        }


        .dots {

            display: inline-flex;

            gap: 4px;

            margin-left: 4px;
        }


        .dots span {

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #6e3482;

            animation:
                dotAnimation 1.2s
                ease-in-out infinite;
        }


        .dots span:nth-child(2) {

            animation-delay: .2s;
        }


        .dots span:nth-child(3) {

            animation-delay: .4s;
        }


        /* ==============================
           PROGRESS BAR
        ============================== */

        .progress {

            width: 200px;

            height: 4px;

            margin: 24px auto 0;

            background: #e2d6e7;

            border-radius: 20px;

            overflow: hidden;
        }


        .progress-bar {

            width: 40%;

            height: 100%;

            border-radius: 20px;

            background: linear-gradient(
                90deg,
                #49225b,
                #9b67aa
            );

            animation:
                progressAnimation 1.3s
                ease-in-out infinite;
        }


        /* ==============================
           ANIMATIONS
        ============================== */

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        @keyframes logoAnimation {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }

        }


        @keyframes dotAnimation {

            0%,
            60%,
            100% {

                opacity: .25;

                transform:
                    translateY(0);
            }

            30% {

                opacity: 1;

                transform:
                    translateY(-4px);
            }

        }


        @keyframes progressAnimation {

            0% {

                transform:
                    translateX(-130%);
            }

            100% {

                transform:
                    translateX(500%);
            }

        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 500px) {

            .logo-box {

                width: 70px;
                height: 70px;

                border-radius: 20px;

                font-size: 30px;
            }

            .brand-name {

                font-size: 25px;
            }

            .brand-subtitle {

                font-size: 9px;

                letter-spacing: 3px;
            }

            .spinner {

                width: 42px;
                height: 42px;
            }

        }

    </style>

</head>


<body>


    <div class="loading-container">


        <!-- LOGO -->

        <div class="logo-box">

            V

        </div>


        <!-- BRAND -->

        <div class="brand-name">

            VastraHub

        </div>


        <div class="brand-subtitle">

            FASHION STORE

        </div>


        <!-- SPINNER -->

        <div class="spinner"></div>


        <!-- TEXT -->

        <div class="loading-text">

            Loading

            <span class="dots">

                <span></span>

                <span></span>

                <span></span>

            </span>

        </div>


        <!-- PROGRESS -->

        <div class="progress">

            <div class="progress-bar"></div>

        </div>


    </div>


    <script>

        /*
         * Loading screen ke baad
         * Home page par bhejna
         */

        setTimeout(function () {

            window.location.href = "/";

        }, 1500);

    </script>


</body>

</html>
