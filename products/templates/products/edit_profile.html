<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | VastraHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5ebfa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 420px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #49225b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #49225b;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        input:focus {
            border-color: #6e3482;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #6e3482;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #49225b;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #6e3482;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Edit Profile</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Username</label>
        <input
            type="text"
            name="username"
            value="{{ user.username }}"
            required
        >

        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ user.email }}"
        >

        <button type="submit">
            Save Changes
        </button>

    </form>

    <a href="{% url 'profile' %}" class="back">
        ← Back to Profile
    </a>

</div>

</body>
</html>
